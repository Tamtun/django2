{% extends 'blog/base.html' %}
{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body">
    <h2>{{ post.title }}</h2>
    <p>{{ post.content }}</p>

    {% if post.preview %}
      <img src="{{ post.preview.url }}" class="img-fluid mb-3" alt="Превью">
    {% endif %}

    <p><strong>Дата:</strong> {{ post.created_at }}</p>
    <p><strong>Просмотров:</strong> {{ post.views }}</p>

    <a href="{% url 'post-update' post.pk %}" class="btn btn-primary">Редактировать</a>
    <a href="{% url 'post-delete' post.pk %}" class="btn btn-danger">Удалить</a>
    <a href="{% url 'post-list' %}" class="btn btn-secondary">Назад</a>
  </div>
</div>
{% endblock %}
