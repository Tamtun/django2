{% extends 'blog/base.html' %}

{% block title %}Удаление записи{% endblock %}

{% block content %}
<h2>Удалить запись "{{ post.title }}"?</h2>

<form method="post">
  {% csrf_token %}
  <button type="submit">Да, удалить</button>
</form>

<a href="{% url 'post-detail' post.pk %}">Отмена</a>
{% endblock %}
