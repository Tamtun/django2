{% extends 'blog/base.html' %}

{% block title %}Форма записи{% endblock %}

{% block content %}
<h2>{% if form.instance.pk %}Редактировать{% else %}Создать{% endif %} запись</h2>

<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Сохранить</button>
</form>

<a href="{% url 'post-list' %}">Назад</a>
{% endblock %}
